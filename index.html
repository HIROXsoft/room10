<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>エレベーター点検お知らせ画像作成</title>
<style>
  :root {
    --blue:#0b5ea8;
    --deep:#08396f;
    --light:#dfefff;
    --ink:#111827;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family:"Yu Gothic UI","Yu Gothic","Meiryo UI","Meiryo",sans-serif;
    background:#eef2f7;
    color:#1f2937;
  }
  .app { display:grid; grid-template-columns:360px 1fr; min-height:100vh; }
  .controls {
    background:#fff;
    padding:22px;
    border-right:1px solid #d6dce5;
    overflow:auto;
  }
  h1 { font-size:20px; margin:0 0 18px; }
  .hint { font-size:12px; line-height:1.6; color:#64748b; margin-bottom:18px; }
  .group { margin:0 0 16px; }
  label { display:block; font-weight:700; font-size:13px; margin-bottom:6px; }
  input, textarea, select {
    width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:10px 11px;
    font:inherit; background:#fff;
  }
  textarea { min-height:92px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .actions { display:grid; gap:10px; margin-top:20px; }
  button { border:0; border-radius:9px; padding:12px 14px; font-weight:700; cursor:pointer; }
  .primary { background:var(--blue); color:#fff; }
  .secondary { background:#e8eef5; color:#1f2937; }
  .external-link {
    display:flex; align-items:center; justify-content:center; gap:8px;
    text-decoration:none; border-radius:9px; padding:12px 14px; font-weight:700;
    background:#0f766e; color:#fff;
  }
  .external-link:hover { filter:brightness(.96); }
  .stage { padding:24px; display:flex; align-items:flex-start; justify-content:center; overflow:auto; }
  .preview-wrap { width:min(100%, 1280px); }
  .preview-title { margin:0 0 10px; font-size:13px; color:#475569; }
  canvas {
    display:block; width:100%; height:auto; background:#fff;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
  }
  .size-note { margin-top:10px; font-size:12px; color:#64748b; }
  @media(max-width:900px){
    .app{grid-template-columns:1fr;}
    .controls{border-right:0;border-bottom:1px solid #d6dce5;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="controls">
    <h1>エレベーター点検画像作成</h1>
    <div class="hint">16:10・1280×800px固定。日付と時間を変更すると右側へ即時反映します。PNG/JPEGで保存できます。桁数が増えてもレイアウトが崩れにくいよう調整済みです。</div>

    <div class="group">
      <label for="date">点検日</label>
      <input id="date" type="date" value="2026-09-30" />
    </div>
    <div class="row">
      <div class="group">
        <label for="start">開始時刻</label>
        <input id="start" type="time" value="10:00" />
      </div>
      <div class="group">
        <label for="end">終了時刻</label>
        <input id="end" type="time" value="12:00" />
      </div>
    </div>
    <div class="group">
      <label for="title">タイトル</label>
      <input id="title" value="エレベーター点検のお知らせ" />
    </div>
    <div class="group">
      <label for="body">本文</label>
      <textarea id="body">上記日時にエレベーターの点検を実施いたします。
点検中はエレベーターをご利用いただけません。
ご不便をおかけいたしますが、ご理解とご協力をお願いいたします。</textarea>
    </div>
    <div class="group">
      <label for="footer">下部注記</label>
      <input id="footer" value="※表示サイズ確認用テスト画像" />
    </div>
    <div class="group">
      <label for="format">保存形式</label>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
      </select>
    </div>
    <div class="actions">
      <button class="primary" id="download">画像を保存</button>
      <button class="secondary" id="reset">初期値に戻す</button>
      <button type="button" class="external-link" id="openBuillink">Buillinkを開く ↗</button>
    </div>
  </aside>

  <main class="stage">
    <div class="preview-wrap">
      <div class="preview-title">プレビュー（16:10 / 1280×800）</div>
      <canvas id="canvas" width="1280" height="800"></canvas>
      <div class="size-note">四隅のガイドと外枠がすべて見えていれば、表示領域にほぼ収まっています。</div>
    </div>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const BLUE = '#0b5ea8';
const DEEP = '#08396f';
const INK = '#111111';
const PALE = '#cfe1f4';
const GUIDE = '#80bce9';
const FONT = '"Yu Gothic UI","Yu Gothic","Meiryo UI","Meiryo",sans-serif';

const BUILLINK_URL = "https://buillink.hitachi.com/Login";

function openBuillinkPopup(){
  const width = 1100;
  const height = 780;
  const dualLeft = window.screenLeft ?? window.screenX ?? 0;
  const dualTop = window.screenTop ?? window.screenY ?? 0;
  const viewportWidth = window.outerWidth || document.documentElement.clientWidth || screen.width;
  const viewportHeight = window.outerHeight || document.documentElement.clientHeight || screen.height;
  const left = Math.max(0, Math.round(dualLeft + (viewportWidth - width) / 2));
  const top = Math.max(0, Math.round(dualTop + (viewportHeight - height) / 2));
  const features = [
    `width=${width}`,
    `height=${height}`,
    `left=${left}`,
    `top=${top}`,
    'resizable=yes',
    'scrollbars=yes',
    'toolbar=no',
    'menubar=no',
    'location=yes',
    'status=no'
  ].join(',');
  const win = window.open(BUILLINK_URL, 'BuillinkPopup', features);
  if (win) {
    win.focus();
  } else {
    window.open(BUILLINK_URL, '_blank');
  }
}

function jpDateString(value){
  const d = value ? new Date(value + 'T00:00:00') : new Date();
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日（${wd}）`;
}

function timeText(v){
  if(!v) return '';
  const [h,m] = v.split(':').map(Number);
  return m === 0 ? `${h}時` : `${h}時${m}分`;
}

function setFont(size, weight='700'){
  ctx.font = `${weight} ${size}px ${FONT}`;
}

function fitText(text, maxWidth, startSize, minSize=22, weight='700'){
  let size = startSize;
  while(size > minSize){
    setFont(size, weight);
    if(ctx.measureText(text).width <= maxWidth) break;
    size -= 2;
  }
  return size;
}

function textWidth(text, size, weight='700'){
  setFont(size, weight);
  return ctx.measureText(text).width;
}

function drawText(text, x, y, size, color=INK, weight='700', align='center', strong=false){
  ctx.save();
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  setFont(size, weight);
  ctx.fillText(text, x, y);
  if(strong){
    ctx.fillText(text, x + 0.7, y);
    ctx.fillText(text, x, y + 0.25);
  }
  ctx.restore();
}

function drawElevatorIcon(x,y,w,h){
  ctx.save();
  ctx.strokeStyle = BLUE;
  ctx.fillStyle = BLUE;
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,18);
  ctx.stroke();

  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x + w/2, y + 14);
  ctx.lineTo(x + w/2, y + h - 14);
  ctx.stroke();

  const headY = y + h * 0.38;
  const headR = 17;
  const leftX = x + w * 0.33;
  const rightX = x + w * 0.67;
  [leftX, rightX].forEach(cx => {
    ctx.beginPath();
    ctx.arc(cx, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - 15, headY + 24, 30, 64);
  });

  ctx.beginPath();
  ctx.moveTo(x + w * 0.30, y - 22);
  ctx.lineTo(x + w * 0.20, y - 6);
  ctx.lineTo(x + w * 0.40, y - 6);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + w * 0.70, y - 6);
  ctx.lineTo(x + w * 0.60, y - 22);
  ctx.lineTo(x + w * 0.80, y - 22);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawHighlight(centerX, centerY, text, size, maxWidth, options={}){
  const paddingX = options.paddingX ?? 44;
  const height = options.height ?? Math.round(size * 0.42);
  const yOffset = options.yOffset ?? Math.round(size * 0.10);
  const radius = options.radius ?? 0;
  const width = Math.min(maxWidth, Math.ceil(textWidth(text, size, '900') + paddingX * 2));
  const x = centerX - width / 2;
  const y = centerY - height / 2 + yOffset;
  ctx.save();
  ctx.fillStyle = PALE;
  if(radius > 0){
    ctx.beginPath();
    ctx.roundRect(x, y, width, height, radius);
    ctx.fill();
  } else {
    ctx.fillRect(x, y, width, height);
  }
  ctx.restore();
}

function draw(){
  const W = 1280, H = 800;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,W,H);

  // outer border and crop guides
  ctx.strokeStyle = DEEP;
  ctx.lineWidth = 3;
  ctx.strokeRect(10,10,W-20,H-20);
  ctx.strokeStyle = GUIDE;
  ctx.lineWidth = 4;
  const g = 30, l = 34;
  [[g,g,1,1],[W-g,g,-1,1],[g,H-g,1,-1],[W-g,H-g,-1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath();
    ctx.moveTo(x, y + sy*l);
    ctx.lineTo(x, y);
    ctx.lineTo(x + sx*l, y);
    ctx.stroke();
  });

  // inner panel guide
  ctx.strokeStyle = '#c6d4e3';
  ctx.lineWidth = 2;
  ctx.strokeRect(28, 28, W - 56, H - 56);

  // title
  const title = $('title').value || 'エレベーター点検のお知らせ';
  const titleSize = fitText(title, 1040, 78, 44, '900');
  drawText(title, W/2, 118, titleSize, DEEP, '900', 'center', true);
  ctx.fillStyle = GUIDE;
  ctx.fillRect(70, 186, 1140, 4);

  // layout anchors
  const iconX = 92;
  const iconY = 286;
  const iconW = 154;
  const iconH = 176;
  const textLeft = 288;
  const textRight = 1140;
  const textCenter = (textLeft + textRight) / 2;
  const textWidthLimit = textRight - textLeft;

  drawElevatorIcon(iconX, iconY, iconW, iconH);

  const dateText = jpDateString($('date').value);
  const range = `${timeText($('start').value)}～${timeText($('end').value)}まで`;

  const dateSize = fitText(dateText, textWidthLimit - 20, 108, 58, '900');
  drawHighlight(textCenter, 282, dateText, dateSize, textWidthLimit - 10, {paddingX:46, height:52, yOffset:10});
  drawText(dateText, textCenter, 278, dateSize, BLUE, '900', 'center', true);

  const rangeSize = fitText(range, textWidthLimit, 100, 54, '900');
  drawHighlight(textCenter, 420, range, rangeSize, textWidthLimit, {paddingX:52, height:58, yOffset:12});
  drawText(range, textCenter, 415, rangeSize, BLUE, '900', 'center', true);

  // body block
  const bodyLines = $('body').value
    .replace(/\\n|¥n/g, '\n')
    .split(/\n+/)
    .map(s => s.trim())
    .filter(Boolean);

  const bodyTop = 538;
  const lineGap = 60;
  bodyLines.slice(0, 4).forEach((line, i) => {
    const size = fitText(line, 1120, 34, 24, '700');
    drawText(line, W/2, bodyTop + i * lineGap, size, INK, '700', 'center', false);
  });

  // footer
  ctx.fillStyle = GUIDE;
  ctx.fillRect(70, 720, 1140, 3);
  drawText($('footer').value || '', W/2, 757, 21, '#666666', '500', 'center', false);
}

['date','start','end','title','body','footer'].forEach(id => $(id).addEventListener('input', draw));

$('reset').addEventListener('click', () => {
  $('date').value = '2026-09-30';
  $('start').value = '10:00';
  $('end').value = '12:00';
  $('title').value = 'エレベーター点検のお知らせ';
  $('body').value = '上記日時にエレベーターの点検を実施いたします。\n点検中はエレベーターをご利用いただけません。\nご不便をおかけいたしますが、ご理解とご協力をお願いいたします。';
  $('footer').value = '※表示サイズ確認用テスト画像';
  draw();
});

$('openBuillink').addEventListener('click', openBuillinkPopup);

$('download').addEventListener('click', () => {
  draw();
  const format = $('format').value;
  const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
  const quality = format === 'jpeg' ? 0.92 : undefined;
  const a = document.createElement('a');
  a.href = canvas.toDataURL(mime, quality);
  a.download = `エレベーター点検_${$('date').value.replaceAll('-','')}_${$('start').value.replace(':','')}-${$('end').value.replace(':','')}.${format === 'jpeg' ? 'jpg' : 'png'}`;
  a.click();
});

draw();
</script>
</body>
</html>
